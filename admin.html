<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copper Coast Map - Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .actions {
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #007aff;
      color: white;
    }

    .btn-primary:hover {
      background: #0056b3;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #545b62;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover {
      background: #218838;
    }

    .location-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .location-card:hover {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .location-id {
      color: #007aff;
      font-weight: 600;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #333;
      font-size: 14px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid #c3e6cb;
    }

    .success-message.show {
      display: block;
    }

    .stats {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      color: #004085;
      border: 1px solid #b8daff;
    }

    input[type="file"] {
      display: none;
    }

    .file-upload-label {
      display: inline-block;
      padding: 12px 24px;
      background: #6c757d;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .file-upload-label:hover {
      background: #545b62;
    }

    .btn-warning {
      background: #ffc107;
      color: #333;
    }

    .btn-warning:hover {
      background: #e0a800;
    }

    .info-message {
      background: #fff3cd;
      color: #856404;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid #ffeaa7;
    }

    .info-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Copper Coast Map - Admin Panel</h1>
    <p class="subtitle">Edit location information for the interactive map</p>

    <div class="success-message" id="successMessage">
      Changes applied! The map will now use your changes.
    </div>

    <div class="info-message" id="infoMessage">
      Live changes active! The map is using your edited data.
    </div>

    <div class="stats" id="stats">
      Loading locations...
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="saveAndApply()">💾 Save & Apply to Map</button>
      <button class="btn-success" onclick="downloadJSON()">📥 Download JSON</button>
      <button class="btn-warning" onclick="clearLiveChanges()">🔄 Clear Live Changes</button>
      <label for="fileUpload" class="file-upload-label">📂 Load JSON File</label>
      <input type="file" id="fileUpload" accept=".json" onchange="loadJSONFile(event)">
      <button class="btn-secondary" onclick="location.reload()">Reset</button>
    </div>

    <div id="locationsContainer">
      Loading...
    </div>
  </div>

  <script>
    let tooltipsData = [];

    // Load the tooltips data on page load
    async function loadData() {
      try {
        const response = await fetch('tooltips-data.json');
        tooltipsData = await response.json();
        renderLocations();
        updateStats();
        checkLiveChanges();
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('locationsContainer').innerHTML =
          '<p style="color: red;">Error loading data. Please make sure tooltips-data.json exists.</p>';
      }
    }

    function checkLiveChanges() {
      const hasLiveChanges = localStorage.getItem('copperCoastTooltips') !== null;
      const infoMessage = document.getElementById('infoMessage');
      if (hasLiveChanges) {
        infoMessage.classList.add('show');
      } else {
        infoMessage.classList.remove('show');
      }
    }

    function updateStats() {
      const stats = document.getElementById('stats');
      const liveStatus = localStorage.getItem('copperCoastTooltips') ? ' (Live changes active ✓)' : '';
      stats.innerHTML = `Total Locations: <strong>${tooltipsData.length}</strong>${liveStatus}`;
    }

    function renderLocations() {
      const container = document.getElementById('locationsContainer');
      container.innerHTML = '';

      tooltipsData.forEach((location, index) => {
        const card = document.createElement('div');
        card.className = 'location-card';
        card.innerHTML = `
          <div class="location-header">
            <span class="location-id">${location.regionId} - Location ${index + 1}</span>
          </div>
          <div class="form-group">
            <label for="title-${index}">Title</label>
            <input type="text" id="title-${index}" value="${escapeHtml(location.title || '')}"
                   onchange="updateLocation(${index}, 'title', this.value)">
          </div>
          <div class="form-group">
            <label for="description-${index}">Description</label>
            <textarea id="description-${index}"
                      onchange="updateLocation(${index}, 'description', this.value)">${escapeHtml(location.description || '')}</textarea>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function updateLocation(index, field, value) {
      tooltipsData[index][field] = value;
    }

    function saveChanges() {
      // Update all fields from the form
      tooltipsData.forEach((location, index) => {
        const title = document.getElementById(`title-${index}`).value;
        const description = document.getElementById(`description-${index}`).value;
        tooltipsData[index].title = title;
        tooltipsData[index].description = description;
      });
    }

    function saveAndApply() {
      // Save changes to data
      saveChanges();

      // Store in localStorage
      localStorage.setItem('copperCoastTooltips', JSON.stringify(tooltipsData));

      // Show success message
      const successMessage = document.getElementById('successMessage');
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);

      // Update status
      updateStats();
      checkLiveChanges();

      // Open the map in a new tab
      window.open('index.html', '_blank');
    }

    function clearLiveChanges() {
      if (confirm('This will remove your live changes and reload the map from the JSON file. Continue?')) {
        localStorage.removeItem('copperCoastTooltips');
        updateStats();
        checkLiveChanges();
        alert('Live changes cleared! The map will now use data from tooltips-data.json');
      }
    }

    function downloadJSON() {
      // Save changes first
      saveChanges();

      // Create a blob with the JSON data
      const jsonString = JSON.stringify(tooltipsData, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      // Create a download link and click it
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tooltips-data.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function loadJSONFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          tooltipsData = JSON.parse(e.target.result);
          renderLocations();
          updateStats();
          alert('JSON file loaded successfully!');
        } catch (error) {
          alert('Error parsing JSON file: ' + error.message);
        }
      };
      reader.readAsText(file);
    }

    // Load data when page loads
    loadData();
  </script>
</body>
</html>
